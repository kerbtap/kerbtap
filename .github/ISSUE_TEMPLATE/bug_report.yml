name: Bug report
description: Report a defect in kerbtap
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report a security vulnerability here. See `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or the steps that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The kerbtap version or the commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
    validations:
      required: false
